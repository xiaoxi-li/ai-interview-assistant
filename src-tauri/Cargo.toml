[package]
name = "easy-interview"
version = "0.1.0"
description = "轻松面试桌面客户端"
authors = ["Easy Interview"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "easy_interview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# IA-15：本地 ASR 原生推理（sherpa-onnx 中文 paraformer）。
# 启用后构建机需安装 libclang（bindgen 依赖），见 README「本地 ASR 原生推理的构建前置」。
# 启用方式：npm run tauri dev -- --features local-asr-native
local-asr-native = ["dep:sherpa-rs"]
# TODO-07（KB-07）：本地 ONNX 嵌入推理（BAAI/bge-m3）。
# `ort` 用 load-dynamic 运行期加载 onnxruntime.dll（构建时由 download-binaries 取回并
# 复制到 target 目录）；`tokenizers` 加载随模型下发的 tokenizer.json。纯 Rust，无 libclang 依赖。
# 启用方式：npm run tauri dev -- --features local-embed-native
local-embed-native = ["dep:ort", "dep:tokenizers"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
thiserror = "1"
jieba-rs = "0.7"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
ureq = { version = "2", features = ["json"] }
cpal = "0.15"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# IA-16：云端 ASR 实时识别（阿里云百炼 DashScope WebSocket，双向流式）。
# 引擎独占专职线程 + 单线程 tokio runtime，用 `tokio::select!` 在「送音频」与「收结果」间调度；
# native-tls 复用系统信任库（Windows schannel / macOS Security.framework），不引入 OpenSSL。
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "handshake",
    "native-tls",
] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# IA-16.9（TODO-10/11）：讯飞（HMAC-SHA256 签名）/ 腾讯（HMAC-SHA1 签名）鉴权与
# OpenAI 兼容 multipart 上传所需的通用算法库
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"

# TODO-07（KB-07）：本地 ONNX 嵌入推理（BAAI/bge-m3，1024 维）。
# 仅 `local-embed-native` 特性启用时编译；默认构建与 CI 不受影响。
# load-dynamic：运行期 dlopen onnxruntime.dll（随包携带，见 tauri.local-embed.conf.json）；
# download-binaries/copy-dylibs：构建期取回 ORT 并复制到 target，供开发运行与测试使用。
ort = { version = "2.0.0-rc", optional = true, default-features = false, features = [
    "load-dynamic",
    "download-binaries",
    "copy-dylibs",
    "tls-native",
] }
tokenizers = { version = "0.20", optional = true, default-features = false, features = [
    "onig",
] }

# IA-14：Windows 系统音频走 WASAPI 端点级回环（cpal 无此能力），仅 Windows 目标引入
[target.'cfg(windows)'.dependencies]
wasapi = "0.24"
# TODO-05（IA-14 进程级回环）：直接使用 windows COM 绑定实现 ApplicationLoopback
# （ActivateAudioInterfaceAsync + AUDIOCLIENT_ACTIVATION_TYPE_PROCESS_LOOPBACK）；
# 版本与 wasapi 的传递依赖对齐，避免多版本共存。`implement` 宏生成的代码引用
# `windows_core` crate 路径，故需同时直接依赖 windows-core。
windows = { version = "0.62", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_Foundation",
    "Win32_System_Threading",
] }
windows-core = "0.62"
# IA-15：Windows 本地 ASR 推理（sherpa-onnx 中文 paraformer），由特性 `local-asr-native` 控制启用。
# 原生库（sherpa-onnx-c-api + onnxruntime）由 sherpa-rs-sys 按 target triple 下载预编译包；
# 关闭默认的 tts 特性以减小体积。macOS 接入见 ai-doc/需求分析.md 的 IA-15 待办。
sherpa-rs = { version = "0.6", optional = true, default-features = false, features = ["download-binaries"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
