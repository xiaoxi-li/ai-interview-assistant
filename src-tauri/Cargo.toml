[package]
name = "ai-interview-assistant"
version = "0.1.0"
description = "AI 面试助手桌面客户端"
authors = ["AI Interview Assistant"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ai_interview_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
thiserror = "1"
jieba-rs = "0.7"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
ureq = { version = "2", features = ["json"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
